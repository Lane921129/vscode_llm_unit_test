name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

# This workflow only reads source code and never receives cloud-model keys.
permissions:
  contents: read

jobs:
  verify:
    name: Verify extension and Python pipeline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']

    steps:
      - name: Check out complete history for secret scanning
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          subprocess.run([sys.executable, '-m', 'venv', '.venv'], check=True)
          python = pathlib.Path('.venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', '-r', 'requirements.txt'], check=True)

      - name: Scan tracked files and reachable Git history for secrets
        run: python python_scripts/secret_scan.py --history

      - name: Run TypeScript and Python regression tests
        run: npm run test:unit

      - name: Build extension
        run: npm run compile
