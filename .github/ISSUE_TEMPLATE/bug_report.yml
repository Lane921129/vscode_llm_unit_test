name: Bug report
description: Report a reproducible extension, AST, trace, Tier, or mutation issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include API keys, tokens,
        passwords, private source code, full authorization headers, or customer data.
  - type: input
    id: version
    attributes:
      label: Extension version or commit
      description: Include the release version or short commit hash.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider type
      options:
        - Local Ollama
        - Google AI Studio
        - OpenAI-compatible Custom API
        - No provider / deterministic Tier 1
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options:
        - Auto
        - Tier 1
        - Tier 2
        - Tier 3
        - Tier 4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal redacted reproduction steps
      description: Use a minimal synthetic Python example. Remove secrets and private source.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and redacted report excerpt
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, VS Code version, and Python version
    validations:
      required: true
